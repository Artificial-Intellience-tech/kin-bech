services:
  - type: web
    name: kin-bech
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn marketplace.wsgi:application"
    postDeployCommand: "python manage.py migrate --noinput"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: kin-bech-db
          property: connectionString

databases:
  - name: kin-bech-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
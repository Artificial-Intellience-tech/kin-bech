{% extends 'base.html' %}
{% block content %}

<h2 class="section-title">Search users</h2>

<form method="get" class="search-form">
    <input type="text" name="q" value="{{ query }}" placeholder="Search username..." required>
    <button type="submit" class="btn">Search</button>
</form>

{% for user in results %}
<div class="card">
    <p>
        <a href="{% url 'profile' user.username %}"><strong>@{{ user.username }}</strong></a>
    </p>
</div>
{% empty %}
{% if query %}
<div class="card">
    <p>No users found for “{{ query }}”.</p>
</div>
{% endif %}
{% endfor %}

{% endblock %}

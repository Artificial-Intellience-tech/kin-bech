{% extends "base.html" %}
{% load static %}

{% block content %}
<h2 class="section-title">Marketplace</h2>

<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
    {% for item in sell_requests %}
    <div class="sell-card">
        <a href="{% url 'profile' item.seller.id %}" style="text-decoration: none; color: inherit; display: block;">
            {% if item.images.exists %}
                <img src="{{ item.images.first.image.url }}" alt="{{ item.title }}">
            {% else %}
                <img src="{% static 'img/no-image.png' %}" alt="No image">
            {% endif %}

            <h3>{{ item.title }}</h3>
            <p>Rs. {{ item.price }}</p>
        </a>
    </div>
    {% empty %}
    <p class="text-muted">No sell requests yet.</p>
    {% endfor %}
</div>
{% endblock %}

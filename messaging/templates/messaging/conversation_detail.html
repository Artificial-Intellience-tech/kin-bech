{% extends 'base.html' %}

{% block content %}
<h2>Chat with {{ other_user.username }}</h2>

<div id="messages-container" style="max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
    {% for message in messages %}
        <div class="message-bubble {% if message.sender == request.user %}me{% else %}other{% endif %}">
            {{ message.text }}
        </div>
    {% endfor %}
</div>

<form method="post" style="margin-top: 12px; display: flex; gap: 8px;">
    {% csrf_token %}
    <input type="text" name="text" placeholder="Type a message..." style="flex: 1;">
    <button type="submit">Send</button>
</form>

<script>
const conversationId = {{ conversation.id }};
const myUserId = {{ request.user.id }};
let lastMessageId = {{ last_message_id|default:0 }};

async function pollMessages() {
    const res = await fetch(`/messaging/api/conversation/${conversationId}/new-messages/?last_id=${lastMessageId}`);
    const data = await res.json();
    if (data.messages.length) {
        const container = document.getElementById("messages-container");
        data.messages.forEach(m => {
            const isMe = m.sender_id === myUserId;
            const bubble = document.createElement("div");
            bubble.className = "message-bubble " + (isMe ? "me" : "other");
            bubble.textContent = m.text;
            container.appendChild(bubble);
            lastMessageId = Math.max(lastMessageId, m.id);
        });
        container.scrollTop = container.scrollHeight;
    }
}

setInterval(pollMessages, 2500);
</script>
{% endblock %}

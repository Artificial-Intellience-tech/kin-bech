{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="chat-header">
    {% if other_user.profile_picture %}
        <img
            src="{{ other_user.profile_picture.url }}"
            alt="{{ other_user.username }}"
            class="chat-avatar"
        >
    {% else %}
        <span class="chat-avatar guest-avatar" aria-label="Guest avatar">👤</span>
    {% endif %}

    <h2>Chat with {{ other_user.username }}</h2>
</div>

<div
    id="messages-container"
    data-conversation-id="{{ conversation.id }}"
    data-user-id="{{ request.user.id }}"
    data-last-message-id="{{ last_message_id }}"
>
    {% for message in messages %}
        <div class="message-bubble {% if message.sender == request.user %}me{% else %}other{% endif %}">
            {{ message.text }}
        </div>
    {% endfor %}
</div>

<form method="post" class="chat-form">
    {% csrf_token %}
    <input
        type="text"
        name="text"
        placeholder="Type a message..."
        autocomplete="off"
        required
    >
    <button type="submit">Send</button>
</form>

<script src="{% static 'js/chat_poll.js' %}"></script>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<h2>Chat with {{ other_user.username }}</h2>

<div id="messages-container" style="max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
    {% for message in messages %}
        <div class="message-bubble {% if message.sender == request.user %}me{% else %}other{% endif %}">
            {{ message.text }}
        </div>
    {% endfor %}
</div>

<form method="post" style="margin-top: 12px; display: flex; gap: 8px;">
    {% csrf_token %}
    <input type="text" name="text" placeholder="Type a message..." style="flex: 1;">
    <button type="submit">Send</button>
</form>

<script>
    // Expose data to the external JS file
    window.kinBechChat = {
        conversationId: {{ conversation.id }},
        myUserId: {{ request.user.id }},
        lastMessageId: {{ last_message_id }}
    };
</script>
<script src="{% static 'js/chat_poll.js' %}"></script>
{% endblock %}

{% extends 'base.html' %}
{% block content %}

<h2 class="section-title">Chat with @{{ other_user.username }}</h2>

<div class="chat-messages">
    {% for msg in messages %}
    <p><strong>{{ msg.sender.username }}:</strong> {{ msg.text }}</p>
    {% endfor %}
</div>

<form method="post" class="chat-form">
    {% csrf_token %}
    <input type="text" name="text" placeholder="Type a message..." required>
    <button type="submit" class="btn">Send</button>
</form>

{% endblock %}

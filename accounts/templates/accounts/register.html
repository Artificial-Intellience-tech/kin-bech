{% extends 'base.html' %}
{% block content %}

<div class="auth-box">
    <h2>Create your account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>

{% endblock %}

{% extends 'base.html' %}
{% block content %}

<div class="auth-box">
    <h2>Log in to Kin Bech</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Log in</button>
    </form>
    <p>No account? <a href="{% url 'register' %}">Sign up</a></p>
</div>

{% endblock %}

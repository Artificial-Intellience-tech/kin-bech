{% extends 'base.html' %}

{% block content %}
<h2 class="section-title">Settings</h2>

<div class="auth-box">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username"
                   value="{{ form.username.value|default:request.user.username }}">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email"
                   value="{{ form.email.value|default:request.user.email }}">
        </div>

        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea name="bio" id="bio" rows="3">{{ form.bio.value|default:request.user.bio }}</textarea>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" name="location" id="location"
                   value="{{ form.location.value|default:request.user.location }}">
        </div>

        <div class="form-group">
            <label for="profile_picture">Profile picture</label>
            {% if request.user.profile_picture %}
                <img src="{{ request.user.profile_picture.url }}"
                     alt="Current picture"
                     style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 6px;">
            {% endif %}
            <input type="file" name="profile_picture" id="profile_picture" accept="image/*">
        </div>

        <button type="submit" class="btn">Save changes</button>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<h2>Search users</h2>

<form method="get">
    <input type="text" name="q" placeholder="Search users..." value="{{ q }}">
    <button type="submit">Search</button>
</form>

<ul>
    {% for u in users %}
        <li>
            {{ u.username }}
            <a href="{% url 'start_conversation' u.username %}">Message</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Kin Bech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Header / Top bar -->
    <header class="site-header">
        <div class="header-inner">
            <a href="{% url 'home' %}" class="brand">Kin Bech</a>

            <nav class="header-nav">
                {% if user.is_authenticated %}
                    <!-- Logged in: username + logout -->
                    <a href="{% url 'profile' user.username %}" style="font-weight: 700;">@{{ user.username }}</a>
                    <a href="{% url 'logout' %}" style="color: #b91c1c; font-size: 13px;">Logout</a>
                {% else %}
                    <!-- Logged out: login and register -->
                    <a href="{% url 'login' %}">Log in</a>
                    <a href="{% url 'register' %}" class="btn" style="padding: 6px 14px; font-size: 13px;">Sign up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <!-- Main content -->
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom navigation (Instagram-style) -->
    {% if user.is_authenticated %}
    <nav class="bottom-nav">
        <a href="{% url 'home' %}" title="Home" class="nav-icon-home">🏠</a>
        <a href="{% url 'search' %}" title="Search" class="nav-icon-search">🔍</a>
        <a href="{% url 'create_post' %}" title="Add" class="nav-icon-add">➕</a>

        <!-- Messages with unread badge -->
        <a href="{% url 'conversations' %}" title="Messages" class="nav-icon-messages">
            ✉️
            {% if unread_msg_count %}
                <span class="badge">{{ unread_msg_count }}</span>
            {% endif %}
        </a>

        <!-- New message (user search) -->
        <a href="{% url 'user_search' %}" title="New message">👤</a>

        <a href="{% url 'settings' %}" title="Settings" class="nav-icon-settings">⚙️</a>
    </nav>
    {% endif %}

    <!-- Full-size image modal -->
    <div id="image-modal" class="image-modal" style="display:none;">
        <div class="image-modal-content">
            <span class="image-modal-close">&times;</span>
            <img id="image-modal-img" src="" alt="">
        </div>
    </div>

    <script>
    (function() {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('image-modal-img');
        const closeBtn = modal.querySelector('.image-modal-close');

        function openModal(src) {
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            modalImg.src = '';
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        // Expose to global scope for inline onclick
        window.openSellImageModal = openModal;
    })();
    </script>

    <style>
    /* Image modal */
    .image-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
    }

    .image-modal-content {
        position: relative;
        max-width: 90vw;
        max-height: 90vh;
    }

    .image-modal-content img {
        max-width: 100%;
        max-height: 90vh;
        display: block;
        border-radius: 8px;
    }

    .image-modal-close {
        position: absolute;
        top: -30px;
        right: 0;
        color: #fff;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    </style>
</body>
</html>
